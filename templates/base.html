<!-- ![AI-ATTRIBUTION]: Konsep modularisasi kode (template inheritance dan partial template) dirancang berdasarkan saran dari AI (Claude) -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Jihan - Portfolio{% endblock %}</title>
    <!-- *LINK GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Limelight&family=Permanent+Marker&family=Protest+Revolution&family=Rubik+Glitch&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- *LINK FOR ICON -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />

    <!-- *CSS -->
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    {% include "components/navbar.html" %}

    <main>{% block content %}{% endblock %}</main>

    {% include "components/footer.html" %}

    <!-- *SCRIPT FOR ICON -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <!-- *UNTUK HEADER BEHAVIOUR AND EXPERIENCE CARD -->
    <script src="/static/js/header.js"></script>
    <script src="/static/js/experience.js"></script>
  </body>
</html>
