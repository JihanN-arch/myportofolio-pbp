<header class="site-header">
  <div class="nav-sticky">
    <!-- ![AI-ATTRIBUTION]: Konsep modularisasi kode (template inheritance dan partial template) dirancang berdasarkan saran dari AI (Claude) -->
    <a href="{% url 'main:show_main' %}" class="brand">JIHAN</a>

    <!-- ![AI-ATTRIBUTION]: kode navigasi (HTML dan CSS) hamburger dibantu dgn mengadaptasi refrensi dari AI (Claude) -->
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- !! NANTI PERBAIKIN NAVBAR -->
    <nav id="navMenu">
      <a 
      href="{% url 'main:show_main' %}"
      class="{% if request.resolver_match.url_name == 'show_main' %}active {% endif %}"
      >Profile</a>

      <a 
      href="{% url 'main:show_projects' %}"
      class="{% if request.resolver_match.url_name == 'show_projects' %}active {% endif %}"
      >Projects</a>

      <a 
      href="{% url 'main:show_showcase' %}"
      class="{% if request.resolver_match.url_name == 'show_showcase' %}active {% endif %}"
      >Expertise</a>

      <a 
      href="{% url 'main:show_experience' %}"
      class="{% if request.resolver_match.url_name == 'show_experience' %}active {% endif %}"
      >Experience</a>

      {% if user.is_authenticated %}
        <span class="nav-user">{{ user.username }}</span>
        <a href="{% url 'main:logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'main:login' %}">Login</a>
        <a href="{% url 'main:register' %}">Register</a>
      {% endif %}
    </nav>  
  </div>
</header>
