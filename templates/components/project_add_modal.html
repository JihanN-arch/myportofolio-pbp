<button
  type="button"
  class="button project-add-button"
  popovertarget="add-project-modal"
>
  <span aria-hidden="true">+</span>
  Tambah Proyek
</button>

<div
  id="add-project-modal"
  class="project-delete-modal"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="add-project-title"
>
  <button
    type="button"
    class="project-delete-modal__backdrop"
    popovertarget="add-project-modal"
    popovertargetaction="hide"
    aria-label="Tutup form tambah proyek"
  ></button>
  <div class="project-delete-modal__content">
    <button
      type="button"
      class="project-delete-modal__close"
      popovertarget="add-project-modal"
      popovertargetaction="hide"
      aria-label="Tutup form tambah proyek"
    >
      X
    </button>
    <h2 id="add-project-title">Tambah Proyek Baru</h2>

    <form
      method="post"
      action="{% url 'main:create_project' %}"
      class="project-form"
    >
      {% csrf_token %} {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }} {% for error in field.errors %}
        <p class="form-error">{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}

      <div class="form-group">
        <label for="secret_code">Kode Rahasia</label>
        <input type="password" name="secret_code" id="secret_code" required />
      </div>

      <div class="project-delete-modal__actions">
        <button
          type="button"
          class="button button-secondary"
          popovertarget="add-project-modal"
          popovertargetaction="hide"
        >
          Batal
        </button>
        <button type="submit" class="button">Tambah</button>
      </div>
    </form>
  </div>
</div>
