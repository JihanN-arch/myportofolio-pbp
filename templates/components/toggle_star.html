<form method="post" action="{{ item.get_star_url }}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in item.starred_by.all %} is-starred{% endif %}"
            title="{% if user in item.starred_by.all %}Batalkan star{% else %}Beri star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in item.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ item.starred_by.count }}</span>
    </button>
</form>
